# docker-compose.yaml
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  gts-net:
    driver: bridge

volumes:
  pgdata:
  seaweed_data:
  certbot-data:
  certbot-certs:

services:
  nginx:
    image: nginx:alpine
    container_name: gts-nginx
    restart: unless-stopped
    networks:
      - gts-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      app-frontend:
        condition: service_started
      landingpage:
        condition: service_started
      app-backend:
        condition: service_healthy
    logging: *default-logging

  db:
    image: postgres:16-alpine
    container_name: gts-db
    restart: unless-stopped
    networks:
      - gts-net
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=25
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: gts-seaweedfs
    restart: unless-stopped
    networks:
      - gts-net
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer"
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweed_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  app-backend:
    build:
      context: ./GTS_app/backend
      dockerfile: Dockerfile
    container_name: gts-app-backend
    restart: unless-stopped
    networks:
      - gts-net
    env_file:
      - ./GTS_app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gts_admin_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gts_super_secret_key}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 5000), 2); s.close()"] # Update this path to your actual health endpoint
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    #logging: *default-logging

  app-frontend:
    build:
      context: .
      dockerfile: ./GTS_app/frontend/Dockerfile
    container_name: gts-app-frontend
    restart: unless-stopped
    networks:
      - gts-net
    env_file:
      - ./GTS_app/.env
    environment:
      BACKEND_INTERNAL_URL: http://app-backend:5000
    expose:
      - "3000"
    depends_on:
      app-backend:
        condition: service_healthy
    #logging: *default-logging
  
  landingpage:
    build:
      context: .
      dockerfile: ./GTS_landingpage/Dockerfile
    container_name: gts-landingpage
    restart: unless-stopped
    networks:
      - gts-net
    env_file:
      - ./GTS_landingpage/.env.production
    expose:
      - "3000"
    logging: *default-logging

  discord-bot:
    build:
      context: ./GTS_discord
      dockerfile: Dockerfile
    container_name: gts-discord
    restart: unless-stopped
    networks:
      - gts-net
    env_file:
      - ./GTS_discord/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_API_URL: http://app-backend:5000
    depends_on:
      db:
        condition: service_healthy
      app-backend:
        condition: service_healthy
    logging: *default-logging