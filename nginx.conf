# 1. HTTP -> HTTPS Redirect & Certbot ACME Challenge for all domains
server {
    listen 80;
    server_name gametablesync.com www.gametablesync.com app.gametablesync.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Landing Page: gametablesync.com & www.gametablesync.com
server {
    listen 443 ssl;
    server_name gametablesync.com www.gametablesync.com;

    ssl_certificate /etc/letsencrypt/live/gametablesync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gametablesync.com/privkey.pem;

    location / {
        proxy_pass http://landingpage:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Core Platform App: app.gametablesync.com
server {
    listen 443 ssl;
    server_name app.gametablesync.com;

    ssl_certificate /etc/letsencrypt/live/gametablesync.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gametablesync.com/privkey.pem;

    # Allow larger uploads (e.g., army lists, PDFs, images for SeaweedFS)
    client_max_body_size 25M;

    # Route /api/ requests directly to the Flask backend container
    location /api/ {
        proxy_pass http://app-backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route all other traffic to the Next.js App Frontend container on port 3000
    location / {
        proxy_pass http://app-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}